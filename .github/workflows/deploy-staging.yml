name: Deploy to Staging

# Push to `staging` to put a branch on staging.givezy.in. Production is
# untouched: separate container, separate database, separate uploads, separate
# payment keys.
on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kaizenventures/givezy-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart staging
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ghcr.io/kaizenventures/givezy-app:staging-${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_REF
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ~/givezy

            # The compose file and Caddyfile always come from main: staging runs
            # main's infrastructure with the staging branch's image. Infrastructure
            # changes therefore have to reach main before they take effect here.
            git fetch --prune origin main
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export GIVEZY_STAGING_IMAGE="$IMAGE_REF"
            docker compose pull staging
            docker compose up -d staging

            docker logout ghcr.io || true
            docker image prune -f || true

            sleep 20
            curl -fsS -o /dev/null --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 http://localhost:3001/api/config

            echo "Staging deployed $IMAGE_REF"
            free -h | head -2 | tail -1
