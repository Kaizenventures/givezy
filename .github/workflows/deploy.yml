name: Deploy to Production

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kaizenventures/givezy-app

jobs:
  # The droplet has 512 MB of memory and a 10 GB disk. Building there needed a
  # swapfile, filled the disk twice and took the site down for ten minutes a
  # deploy. Build here instead; the droplet just pulls the result.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache between runs, so a typical build is a couple of minutes
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The droplet authenticates to the registry with this run's token
      packages: read
    steps:
      - name: Pull and restart on the droplet
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          # Valid only for this run, so no long-lived token sits on the droplet
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ghcr.io/kaizenventures/givezy-app:${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_REF
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd ~/givezy

            # compose file and .env live in the checkout; .env is untracked
            git fetch --prune origin main
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pin to this commit's image rather than :latest, so a restart later
            # cannot silently pick up a different build
            export GIVEZY_IMAGE="$IMAGE_REF"
            docker compose pull app
            docker compose up -d

            docker logout ghcr.io || true
            docker image prune -f || true

            # The app migrates and seeds before Next starts, which takes a while
            # on this box, and curl's plain --retry ignores connection resets.
            sleep 20
            curl -fsS -o /dev/null --retry 10 --retry-delay 5 --retry-all-errors --max-time 30 http://localhost:3000/api/config

            echo "Deployed $IMAGE_REF"
            df -h / | tail -1
            free -h | head -2
