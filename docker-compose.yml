services:
  app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/data
      - app-uploads:/app/public/uploads
    environment:
      - TZ=Asia/Kolkata
      - DATABASE_URL=file:./data/givezy.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://givezy.in
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Razorpay
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      # Shiprocket
      - SHIPROCKET_EMAIL=${SHIPROCKET_EMAIL}
      - SHIPROCKET_PASSWORD=${SHIPROCKET_PASSWORD}
      # Pickup/warehouse address
      - PICKUP_LOCATION_NAME=${PICKUP_LOCATION_NAME:-Givezy Warehouse}
      - PICKUP_ADDRESS=${PICKUP_ADDRESS}
      - PICKUP_CITY=${PICKUP_CITY:-Hyderabad}
      - PICKUP_STATE=${PICKUP_STATE:-Telangana}
      - PICKUP_PINCODE=${PICKUP_PINCODE:-500001}
      - PICKUP_PHONE=${PICKUP_PHONE}
      # Razorpay webhook (payment.captured / payment.failed)
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      # Demo mode — auto-disabled once real Razorpay keys are present
      - DEMO_MODE=${DEMO_MODE:-false}
      # Transactional email (optional; no-ops when unset)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - ADMIN_NOTIFY_EMAIL=${ADMIN_NOTIFY_EMAIL:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  app-uploads:
  caddy-data:
  caddy-config:
