services:
  # Production. Built and pushed by GitHub Actions; the droplet only pulls.
  # To build by hand in an emergency:
  #   docker build -t ghcr.io/kaizenventures/givezy-app:latest .
  app:
    image: ${GIVEZY_IMAGE:-ghcr.io/kaizenventures/givezy-app:latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/data
      - app-uploads:/app/public/uploads
    # Secrets come from the file; anything that must differ between environments
    # is set explicitly below, where it cannot be got wrong by editing .env.
    env_file: .env
    environment:
      - APP_ENV=production
      - NEXTAUTH_URL=https://givezy.in
      - TZ=Asia/Kolkata
      - DATABASE_URL=file:./data/givezy.db

  # Staging. Same image by default, but its own database, its own uploads and
  # its own .env — so test payments, test bookings and admin experiments cannot
  # reach production data.
  staging:
    image: ${GIVEZY_STAGING_IMAGE:-ghcr.io/kaizenventures/givezy-app:staging}
    restart: unless-stopped
    ports:
      # Exposed on a different port so the host can health-check it directly
      - "3001:3000"
    volumes:
      - staging-data:/app/data
      - staging-uploads:/app/public/uploads
    # Capped so a runaway staging process cannot get production OOM-killed.
    # The box has 454 MB total and the app uses ~65 MB at rest; this leaves
    # room to boot and migrate without letting staging take the machine.
    mem_limit: 256m
    memswap_limit: 512m
    cpus: 0.5
    env_file: .env.staging
    environment:
      - APP_ENV=staging
      - NEXTAUTH_URL=https://staging.givezy.in
      - TZ=Asia/Kolkata
      - DATABASE_URL=file:./data/givezy.db

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  app-uploads:
  staging-data:
  staging-uploads:
  caddy-data:
  caddy-config:
